name: MASTER full functional regression (offline)

on:
  pull_request:
    paths:
      - "Quotation_KEKOREA/**"
      - ".github/workflows/master-full-functional-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-functional-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ""
      WHOIS_POP_PASSWORD: ""
      WHOIS_SMTP_PASSWORD: ""
      SUPABASE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app runtime and offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Quotation_KEKOREA/requirements.txt
      - name: Compile all KE KOREA app modules
        run: python -m compileall -q Quotation_KEKOREA
      - name: Run all agent, trade, contract, PDF, pricing and auth tests
        run: python -m unittest discover -s Quotation_KEKOREA/tests -p 'test_*.py' -q
