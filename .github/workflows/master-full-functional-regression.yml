name: MASTER full functional regression versus main (offline)

on:
  pull_request:
    paths:
      - "Quotation_KEKOREA/**"
      - ".github/workflows/master-full-functional-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-functional-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ""
      WHOIS_POP_PASSWORD: ""
      WHOIS_SMTP_PASSWORD: ""
      SUPABASE_SECRET_KEY: ""
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app runtime and offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Quotation_KEKOREA/requirements.txt
      - name: Compile all KE KOREA app modules
        run: python -m compileall -q Quotation_KEKOREA
      - name: Check out untouched production main as baseline
        run: git worktree add --detach /tmp/ke-korea-main-baseline origin/main
      - name: Compare all tests against current main with outbound network blocked
        run: python Quotation_KEKOREA/tests/full_suite_compare.py
      - name: Upload sanitized baseline-versus-feature audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-full-suite-comparison
          path: /tmp/master-full-suite-audit.json
          retention-days: 7
          if-no-files-found: warn
