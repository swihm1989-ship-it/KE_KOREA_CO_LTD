name: Refresh market headlines
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check news database configuration
        env:
          NEWS_SUPABASE_URL: ${{ secrets.NEWS_SUPABASE_URL }}
          NEWS_SUPABASE_SECRET_KEY: ${{ secrets.NEWS_SUPABASE_SECRET_KEY }}
        run: |
          test -n "$NEWS_SUPABASE_URL" || { echo "::error::NEWS_SUPABASE_URL is missing"; exit 1; }
          test -n "$NEWS_SUPABASE_SECRET_KEY" || { echo "::error::NEWS_SUPABASE_SECRET_KEY is missing"; exit 1; }
      - name: Fetch public RSS headlines and store in Supabase
        env:
          NEWS_SUPABASE_URL: ${{ secrets.NEWS_SUPABASE_URL }}
          NEWS_SUPABASE_SECRET_KEY: ${{ secrets.NEWS_SUPABASE_SECRET_KEY }}
        run: python -m Quotation_KEKOREA.orchestration.workflows.refresh_market_news
