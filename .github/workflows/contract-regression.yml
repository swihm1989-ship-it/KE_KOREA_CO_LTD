name: Contract regression tests

on:
  pull_request:
    paths:
      - 'Quotation_KEKOREA/**'
      - '.github/workflows/contract-regression.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Quotation_KEKOREA/requirements.txt
      - name: Compile contract modules
        run: python -m compileall -q Quotation_KEKOREA/contracts Quotation_KEKOREA/tests
      - name: Source reference recovery tests
        run: python -m unittest Quotation_KEKOREA.tests.test_contract_source_refs_recovery -v
      - name: Full contract regression suite
        run: python -m unittest discover -s Quotation_KEKOREA/tests -p 'test_contract*.py' -q
