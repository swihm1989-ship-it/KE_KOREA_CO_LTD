# Separate Render Blueprint. This NEVER changes the existing render.yaml service.
# Render Dashboard > New > Blueprint > Blueprint Path: render-orchestration.yaml
services:
  - type: web
    name: ke-korea-orchestration-demo
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r Quotation_KEKOREA/orchestration/ui/requirements.txt
    startCommand: python -m Quotation_KEKOREA.orchestration.ui.secure_launch
    autoDeployTrigger: off
    envVars:
      - key: ORCHESTRATION_ALLOWED_EMAILS
        sync: false
      - key: ORCHESTRATION_OIDC_CLIENT_ID
        sync: false
      - key: ORCHESTRATION_OIDC_CLIENT_SECRET
        sync: false
      - key: ORCHESTRATION_OIDC_METADATA_URL
        sync: false
      - key: ORCHESTRATION_OIDC_REDIRECT_URI
        sync: false
      - key: ORCHESTRATION_OIDC_COOKIE_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
